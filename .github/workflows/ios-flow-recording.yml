name: iOS flow recording

# Test-only B/D/F audit harness on this branch. Do not merge to main.
# Separate from ios-archive.yml. Does not upload to App Store Connect.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bdf-audit:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download RevenueCat XCFramework
        run: |
          curl -L -o RevenueCat.xcframework.zip \
            https://github.com/RevenueCat/purchases-ios/releases/download/5.84.0/RevenueCat.xcframework.zip
          unzip -q RevenueCat.xcframework.zip -d rc_tmp
          XCFW=$(find rc_tmp -maxdepth 3 -name "RevenueCat.xcframework" -type d | head -1)
          mv "$XCFW" ./RevenueCat.xcframework
          rm -rf rc_tmp
          xattr -cr RevenueCat.xcframework || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run B/D/F demo audit
        env:
          QA_EMAIL: ${{ secrets.FITMUNCH_DEMO_REVIEW_EMAIL }}
          QA_PASSWORD: ${{ secrets.FITMUNCH_DEMO_REVIEW_PASSWORD }}
        run: bash scripts/run-bdf-demo-audit.sh

      - name: Forget the credential file
        if: always()
        run: rm -f /tmp/fitmunch-qa-credentials

      - name: Upload B/D/F audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitmunch-bdf-demo-audit
          path: artifacts/bdf-demo-audit/
          if-no-files-found: error
          retention-days: 14
