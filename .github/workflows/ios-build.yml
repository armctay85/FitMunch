name: iOS Build and Test

# The iOS lane is parked while the web product leads. Only build when iOS
# sources actually change (or on manual dispatch) so web pushes don't
# generate failure noise.
on:
  push:
    branches: [ main, master ]
    paths:
      - "FitMunch/**"
      - "FitMunchTests/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - "scripts/check-ios-camera-usage.sh"
      - "scripts/run-pre-asc-ci-tests.sh"
      - "scripts/warm-simulator-launch.sh"
      - "docs/PRE_ASC_DEVICE_AUDIT.md"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [ main, master, cursor/b11-coach-blocked-89f8 ]
    paths:
      - "FitMunch/**"
      - "FitMunchTests/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - "scripts/check-ios-camera-usage.sh"
      - "scripts/run-pre-asc-ci-tests.sh"
      - "scripts/warm-simulator-launch.sh"
      - "docs/PRE_ASC_DEVICE_AUDIT.md"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Pre-ASC camera usage gate
      run: bash scripts/check-ios-camera-usage.sh

    - name: Select Xcode
      run: sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    # The project references RevenueCat.xcframework at repo root (not vendored).
    # Same download used by ios-archive.yml — without it every build fails with
    # "There is no XCFramework found".
    - name: Download RevenueCat XCFramework
      run: |
        curl -L -o RevenueCat.xcframework.zip \
          https://github.com/RevenueCat/purchases-ios/releases/download/5.84.0/RevenueCat.xcframework.zip
        unzip -q RevenueCat.xcframework.zip -d rc_tmp
        XCFW=$(find rc_tmp -maxdepth 3 -name "RevenueCat.xcframework" -type d | head -1)
        mv "$XCFW" ./RevenueCat.xcframework
        rm -rf rc_tmp
        xattr -cr RevenueCat.xcframework || true

    - name: Generate Xcode project
      run: |
        xcodegen generate
        python3 scripts/ensure-storekit-scheme.py

    - name: Resolve packages
      run: xcodebuild -resolvePackageDependencies -project FitMunch.xcodeproj -scheme FitMunch

    - name: Build
      # generic simulator destination: compiles for any sim without depending on
      # which device models the runner image ships (varies across macOS images)
      run: |
        xcodebuild clean build \
          -project FitMunch.xcodeproj \
          -scheme FitMunch \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO

    - name: StoreKit session proof
      run: |
        set -euo pipefail
        UDID="$(bash scripts/boot-pinned-simulator.sh "iPhone 17 Pro" "iPhone 17 Pro Max")"
        echo "proof destination $UDID os=26.2"
        rm -rf "$RUNNER_TEMP/storekit-proof.xcresult"
        xcodebuild test \
          -project FitMunch.xcodeproj \
          -scheme FitMunch \
          -destination "platform=iOS Simulator,id=$UDID,arch=arm64" \
          -only-testing:FitMunchTests/FitMunchProductsStoreKitTests \
          -resultBundlePath "$RUNNER_TEMP/storekit-proof.xcresult" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=-

    - name: Release binary does not link StoreKitTest
      run: |
        set -euo pipefail
        xcodebuild build \
          -project FitMunch.xcodeproj \
          -scheme FitMunch \
          -configuration Release \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/ReleaseDD" \
          CODE_SIGNING_ALLOWED=NO
        BIN=$(find "$RUNNER_TEMP/ReleaseDD/Build/Products" -path '*/FitMunch.app/FitMunch' -type f -print -quit)
        test -n "$BIN"
        echo "Release binary: $BIN"
        otool -L "$BIN"
        if otool -L "$BIN" | grep -q StoreKitTest; then
          echo "StoreKitTest is linked into the Release binary"
          exit 1
        fi
        echo "Release link check: StoreKitTest is absent"

    - name: Pre-ASC unit + UI tests A–G (macos Simulator)
      run: bash scripts/run-pre-asc-ci-tests.sh

    - name: Upload pre-ASC audit artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pre-asc-audit-build-9
        path: artifacts/pre-asc-audit/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload pre-ASC paywall screenshots
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pre-asc-paywall-screenshots-build-9
        path: artifacts/pre-asc-audit/screenshots/
        if-no-files-found: warn
        retention-days: 14
