name: iOS Build and Test

# The iOS lane is parked while the web product leads. Only build when iOS
# sources actually change (or on manual dispatch) so web pushes don't
# generate failure noise.
on:
  push:
    branches: [ main, master ]
    paths:
      - "FitMunch/**"
      - "FitMunchTests/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - "scripts/check-ios-camera-usage.sh"
      - "scripts/run-pre-asc-ci-tests.sh"
      - "docs/PRE_ASC_DEVICE_AUDIT.md"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "FitMunch/**"
      - "FitMunchTests/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - "scripts/check-ios-camera-usage.sh"
      - "scripts/run-pre-asc-ci-tests.sh"
      - "docs/PRE_ASC_DEVICE_AUDIT.md"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4

    - name: Pre-ASC camera usage gate
      run: bash scripts/check-ios-camera-usage.sh

    - name: Select Xcode
      run: sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    # The project references RevenueCat.xcframework at repo root (not vendored).
    # Same download used by ios-archive.yml — without it every build fails with
    # "There is no XCFramework found".
    - name: Download RevenueCat XCFramework
      run: |
        curl -L -o RevenueCat.xcframework.zip \
          https://github.com/RevenueCat/purchases-ios/releases/download/5.84.0/RevenueCat.xcframework.zip
        unzip -q RevenueCat.xcframework.zip -d rc_tmp
        XCFW=$(find rc_tmp -maxdepth 3 -name "RevenueCat.xcframework" -type d | head -1)
        mv "$XCFW" ./RevenueCat.xcframework
        rm -rf rc_tmp
        xattr -cr RevenueCat.xcframework || true

    - name: Generate Xcode project
      run: |
        xcodegen generate
        python3 scripts/ensure-storekit-scheme.py

    - name: Resolve packages
      run: xcodebuild -resolvePackageDependencies -project FitMunch.xcodeproj -scheme FitMunch

    - name: Build
      # generic simulator destination: compiles for any sim without depending on
      # which device models the runner image ships (varies across macOS images)
      run: |
        xcodebuild clean build \
          -project FitMunch.xcodeproj \
          -scheme FitMunch \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO

    - name: StoreKit session proof
      run: |
        set -euo pipefail
        UDID=$(xcrun simctl list devices available \
          | grep -E 'iPhone' \
          | head -1 \
          | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' \
          | head -1)
        test -n "$UDID"
        echo "proof destination $UDID"
        xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
        xcodebuild test \
          -project FitMunch.xcodeproj \
          -scheme FitMunch \
          -destination "platform=iOS Simulator,id=$UDID" \
          -only-testing:FitMunchTests/FitMunchProductsStoreKitTests \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=-

    - name: Pre-ASC unit + UI tests A–G (macos Simulator)
      run: bash scripts/run-pre-asc-ci-tests.sh

    - name: Upload pre-ASC audit artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pre-asc-audit-build-9
        path: artifacts/pre-asc-audit/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload pre-ASC paywall screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pre-asc-paywall-screenshots-build-9
        path: artifacts/pre-asc-audit/screenshots/
        if-no-files-found: warn
        retention-days: 14
