name: Jest

# Full jest suite on every pull request and every push to main.
# jest.config.js testMatch decides which files run; test_jest_testmatch_guard.js
# fails if a root test_*.js is left out of it (or not on its NOT_JEST list).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jest-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jest:
    name: jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Throwaway Postgres for test_meal_plan_owner_pg.js (same as web-quality test job).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fmtest
          POSTGRES_PASSWORD: fmtest
          POSTGRES_DB: fmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fmtest:fmtest@localhost:5432/fmtest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest (full suite)
        run: npx jest --runInBand --ci

      - name: Note gated tests
        if: always()
        run: echo "Live Stripe test-mode checkout test skipped by design (no sk_test key in CI)." >> "$GITHUB_STEP_SUMMARY"
