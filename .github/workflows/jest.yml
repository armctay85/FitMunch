name: Jest

# Full jest suite on every pull request and every push to main.
# jest.config.js testMatch decides which files run; test_jest_testmatch_guard.js
# fails if a root test_*.js is left out of it.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: jest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome (rendered checks)
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Jest (full suite)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npx jest --runInBand --ci
