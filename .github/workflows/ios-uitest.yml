name: iOS full-screen UITest

# Build 10: prove the launch screen fills the phone and the built Info.plist
# still has UILaunchScreen plus the RevenueCat key after XcodeGen.

on:
  pull_request:
    paths:
      - "FitMunch/**"
      - "FitMunchTests/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - ".github/workflows/ios-uitest.yml"
  push:
    branches: [main, master]
    paths:
      - "FitMunch/**"
      - "FitMunchTests/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - ".github/workflows/ios-uitest.yml"
  workflow_dispatch:

jobs:
  uitest:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download RevenueCat XCFramework
        run: |
          curl -L -o RevenueCat.xcframework.zip \
            https://github.com/RevenueCat/purchases-ios/releases/download/5.84.0/RevenueCat.xcframework.zip
          unzip -q RevenueCat.xcframework.zip -d rc_tmp
          XCFW=$(find rc_tmp -maxdepth 3 -name "RevenueCat.xcframework" -type d | head -1)
          mv "$XCFW" ./RevenueCat.xcframework
          rm -rf rc_tmp
          xattr -cr RevenueCat.xcframework || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and check processed Info.plist
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project FitMunch.xcodeproj \
            -scheme FitMunch \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
          PLIST=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -path '*/FitMunch.app/Info.plist' -print -quit)
          test -n "$PLIST"
          echo "Built Info.plist: $PLIST"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$PLIST"
          COLOR=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$PLIST")
          IMAGE=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIImageName' "$PLIST")
          test "$COLOR" = "LaunchBackground"
          test "$IMAGE" = "LaunchLogo"
          KEY=$(/usr/libexec/PlistBuddy -c 'Print :REVENUECAT_API_KEY' "$PLIST")
          test -n "$KEY"
          test "$KEY" != "appl_xxx"
          echo "$KEY" | grep -q '^appl_'
          if /usr/libexec/PlistBuddy -c 'Print :NSHealthShareUsageDescription' "$PLIST" >/dev/null 2>&1; then
            echo "NSHealthShareUsageDescription is in the built plist"
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :NSHealthUpdateUsageDescription' "$PLIST" >/dev/null 2>&1; then
            echo "NSHealthUpdateUsageDescription is in the built plist"
            exit 1
          fi
          echo "PlistBuddy OK UILaunchScreen=$COLOR/$IMAGE REVENUECAT_API_KEY present"

      - name: Full-screen window on Pro Max and iPhone 11 Pro Max
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios-uitest
          xcrun simctl list devices available | tee artifacts/ios-uitest/simulators.txt
          xcrun simctl list devicetypes | grep -E 'iPhone (17|16|11) Pro Max' | tee artifacts/ios-uitest/devicetypes.txt || true

          udid_for() {
            xcrun simctl list devices available \
              | grep -F "$1 (" \
              | head -1 \
              | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' \
              | head -1
          }

          latest_runtime() {
            xcrun simctl list runtimes available \
              | sed -n 's/.*\(com\.apple\.CoreSimulator\.SimRuntime\.iOS[-0-9]*\).*/\1/p' \
              | tail -1
          }

          ensure_device() {
            local name="$1"
            local type="$2"
            local udid
            udid="$(udid_for "$name" || true)"
            if [[ -z "$udid" ]]; then
              local runtime
              runtime="$(latest_runtime)"
              test -n "$runtime"
              udid="$(xcrun simctl create "$name" "$type" "$runtime")"
            fi
            echo "$udid"
          }

          PRO_NAME="iPhone 17 Pro Max"
          PRO_UDID="$(ensure_device "iPhone 17 Pro Max" "iPhone 17 Pro Max" || true)"
          if [[ -z "${PRO_UDID:-}" ]]; then
            PRO_NAME="iPhone 16 Pro Max"
            PRO_UDID="$(ensure_device "iPhone 16 Pro Max" "iPhone 16 Pro Max")"
          fi
          ELEVEN_UDID="$(ensure_device "iPhone 11 Pro Max" "iPhone 11 Pro Max")"
          echo "pro=$PRO_NAME $PRO_UDID" | tee artifacts/ios-uitest/destinations.txt
          echo "eleven=iPhone 11 Pro Max $ELEVEN_UDID" | tee -a artifacts/ios-uitest/destinations.txt

          run_one() {
            local name="$1"
            local udid="$2"
            local slug="$3"
            local bundle="artifacts/ios-uitest/${slug}.xcresult"
            local rc=0
            rm -rf "$bundle"
            xcrun simctl boot "$udid" >/dev/null 2>&1 || true
            xcrun simctl bootstatus "$udid" -b || true
            set +e
            xcodebuild test \
              -project FitMunch.xcodeproj \
              -scheme FitMunch \
              -destination "platform=iOS Simulator,id=$udid" \
              -only-testing:FitMunchUITests/FullScreenWindowTests \
              -resultBundlePath "$bundle" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=- \
              | tee "artifacts/ios-uitest/${slug}.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$name exit=$rc" | tee -a artifacts/ios-uitest/destinations.txt
            mkdir -p "artifacts/ios-uitest/screenshots"
            if [[ -d /tmp/fitmunch-b10-screenshots ]]; then
              cp -R /tmp/fitmunch-b10-screenshots/. artifacts/ios-uitest/screenshots/ || true
            fi
            if [[ -d "$HOME/fitmunch-b10-screenshots" ]]; then
              cp -R "$HOME/fitmunch-b10-screenshots/." artifacts/ios-uitest/screenshots/ || true
            fi
            simroot="$HOME/Library/Developer/CoreSimulator/Devices/$udid"
            if [[ -d "$simroot" ]]; then
              find "$simroot" -type f \( -name 'first-run-*.png' -o -name 'paywall-*.png' -o -name 'purchase-sheet*.png' -o -name 'sizes.txt' \) -print \
                | while read -r found; do
                    cp "$found" artifacts/ios-uitest/screenshots/ || true
                  done
            fi
            attach_dir="artifacts/ios-uitest/attachments-${slug}"
            rm -rf "$attach_dir"
            mkdir -p "$attach_dir"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$attach_dir" \
              || xcrun xcresulttool export --type attachments --path "$bundle" --output-path "$attach_dir" \
              || true
            find "$attach_dir" -type f -name '*.png' -print | while read -r png; do
              base=$(basename "$png")
              case "$base" in
                first-run-*|paywall-*|purchase-sheet*) cp "$png" "artifacts/ios-uitest/screenshots/${base}" ;;
                *) cp "$png" "artifacts/ios-uitest/screenshots/${slug}-${base}" ;;
              esac
            done
            if ! grep -q 'APP_FOREGROUND_SHOT ' "artifacts/ios-uitest/${slug}.log"; then
              echo "Missing APP_FOREGROUND_SHOT in $slug log. The capture was not the running app."
              return 1
            fi
            if ! grep -q 'FULLSCREEN_SIZE ' "artifacts/ios-uitest/${slug}.log"; then
              echo "Missing FULLSCREEN_SIZE in $slug log"
              return 1
            fi
            if grep -q '320x480' "artifacts/ios-uitest/${slug}.log"; then
              echo "Letterboxed 320x480 in $slug log"
              return 1
            fi
            return "$rc"
          }

          set +e
          run_one "$PRO_NAME" "$PRO_UDID" "pro-max"
          PRO_RC=$?
          run_one "iPhone 11 Pro Max" "$ELEVEN_UDID" "iphone-11-pro-max"
          ELEVEN_RC=$?
          set -e
          echo "pro_exit=$PRO_RC eleven_exit=$ELEVEN_RC" | tee -a artifacts/ios-uitest/destinations.txt
          test "$PRO_RC" = "0"
          test "$ELEVEN_RC" = "0"

          echo "=== FULLSCREEN_SIZE lines ==="
          grep 'FULLSCREEN_SIZE ' artifacts/ios-uitest/*.log
          echo "=== screenshot files ==="
          find artifacts/ios-uitest/screenshots -type f -print | sort
          test -n "$(find artifacts/ios-uitest/screenshots \( -name 'first-run-*.png' -o -name '*first-run*.png' \) | head -1)"
          test -n "$(find artifacts/ios-uitest/screenshots \( -name 'paywall-*.png' -o -name '*paywall*.png' \) | head -1)"
          grep -q '440x956' artifacts/ios-uitest/pro-max.log
          grep -q '414x896' artifacts/ios-uitest/iphone-11-pro-max.log
          grep -q 'APP_FOREGROUND_SHOT ' artifacts/ios-uitest/pro-max.log
          grep -q 'APP_FOREGROUND_SHOT ' artifacts/ios-uitest/iphone-11-pro-max.log

          PURCHASE_BUNDLE="artifacts/ios-uitest/purchase-sheet.xcresult"
          rm -rf "$PURCHASE_BUNDLE"
          set +e
          xcodebuild test \
            -project FitMunch.xcodeproj \
            -scheme FitMunchStoreKit \
            -destination "platform=iOS Simulator,id=$PRO_UDID" \
            -only-testing:FitMunchUITests/PaywallPurchaseSheetTests \
            -resultBundlePath "$PURCHASE_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            | tee artifacts/ios-uitest/purchase-sheet.log
          PURCHASE_RC=${PIPESTATUS[0]}
          set -e
          echo "purchase_sheet_exit=$PURCHASE_RC" | tee -a artifacts/ios-uitest/destinations.txt
          if [[ -d /tmp/fitmunch-b10-screenshots ]]; then
            cp -R /tmp/fitmunch-b10-screenshots/. artifacts/ios-uitest/screenshots/ || true
          fi
          simroot="$HOME/Library/Developer/CoreSimulator/Devices/$PRO_UDID"
          if [[ -d "$simroot" ]]; then
            find "$simroot" -type f -name 'purchase-sheet*.png' -print \
              | while read -r found; do
                  cp "$found" artifacts/ios-uitest/screenshots/ || true
                done
          fi
          attach_dir="artifacts/ios-uitest/attachments-purchase-sheet"
          rm -rf "$attach_dir"
          mkdir -p "$attach_dir"
          xcrun xcresulttool export attachments --path "$PURCHASE_BUNDLE" --output-path "$attach_dir" \
            || xcrun xcresulttool export --type attachments --path "$PURCHASE_BUNDLE" --output-path "$attach_dir" \
            || true
          find "$attach_dir" -type f -name '*.png' -print | while read -r png; do
            cp "$png" "artifacts/ios-uitest/screenshots/purchase-sheet-$(basename "$png")"
          done
          grep -q 'APP_FOREGROUND_SHOT ' artifacts/ios-uitest/purchase-sheet.log
          test "$PURCHASE_RC" = "0"
          test -n "$(find artifacts/ios-uitest/screenshots -name 'purchase-sheet*.png' | head -1)"

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-uitest-screenshots-build-10
          path: artifacts/ios-uitest/screenshots/
          if-no-files-found: warn
          retention-days: 14
