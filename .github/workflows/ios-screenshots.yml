name: iOS App Store screenshots

# Real SwiftUI captures on the macos-26 simulator. HTML mockup frames are
# not store art (Guideline 2.3.3). This job does not upload to ASC or review.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "FitMunch/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - ".github/workflows/ios-screenshots.yml"
      - "scripts/ocr-store-screenshots.swift"
      - "scripts/capture-appstore-screenshots.sh"
      - "scripts/warm-simulator-launch.sh"
  push:
    branches: [main, master]
    paths:
      - "FitMunch/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - ".github/workflows/ios-screenshots.yml"
      - "scripts/ocr-store-screenshots.swift"
      - "scripts/capture-appstore-screenshots.sh"
      - "scripts/warm-simulator-launch.sh"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download RevenueCat XCFramework
        run: |
          curl -L -o RevenueCat.xcframework.zip \
            https://github.com/RevenueCat/purchases-ios/releases/download/5.84.0/RevenueCat.xcframework.zip
          unzip -q RevenueCat.xcframework.zip -d rc_tmp
          XCFW=$(find rc_tmp -maxdepth 3 -name "RevenueCat.xcframework" -type d | head -1)
          mv "$XCFW" ./RevenueCat.xcframework
          rm -rf rc_tmp
          xattr -cr RevenueCat.xcframework || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Capture real-app screenshots
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: bash scripts/capture-appstore-screenshots.sh

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitmunch-appstore-screenshots
          path: artifacts/appstore-screenshots/**/*.png
          if-no-files-found: error
          retention-days: 14
