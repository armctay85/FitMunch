name: iOS App Store screenshots

# Real SwiftUI captures on the macos-26 simulator. HTML mockup frames are
# not store art (Guideline 2.3.3). This job does not upload to ASC or review.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "FitMunch/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - ".github/workflows/ios-screenshots.yml"
      - "scripts/ocr-store-screenshots.swift"
      - "scripts/capture-appstore-screenshots.sh"
      - "scripts/record-appstore-preview.sh"
      - "scripts/frame-appstore-screenshots.py"
  push:
    branches: [main, master]
    paths:
      - "FitMunch/**"
      - "FitMunchUITests/**"
      - "project.yml"
      - ".github/workflows/ios-screenshots.yml"
      - "scripts/ocr-store-screenshots.swift"
      - "scripts/capture-appstore-screenshots.sh"
      - "scripts/record-appstore-preview.sh"
      - "scripts/frame-appstore-screenshots.py"

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read store build
        id: store
        run: |
          version="$(awk -F: '/CURRENT_PROJECT_VERSION:/ { gsub(/[^0-9]/, "", $2); print $2; exit }' project.yml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" != "10" ]]; then
            echo "Store art shoots from build 10 only. This checkout is build ${version:-missing}."
          fi

      - name: Select Xcode
        if: steps.store.outputs.version == '10'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.store.outputs.version == '10'
        run: brew install xcodegen

      - name: Download RevenueCat XCFramework
        if: steps.store.outputs.version == '10'
        run: |
          curl -L -o RevenueCat.xcframework.zip \
            https://github.com/RevenueCat/purchases-ios/releases/download/5.84.0/RevenueCat.xcframework.zip
          unzip -q RevenueCat.xcframework.zip -d rc_tmp
          XCFW=$(find rc_tmp -maxdepth 3 -name "RevenueCat.xcframework" -type d | head -1)
          mv "$XCFW" ./RevenueCat.xcframework
          rm -rf rc_tmp
          xattr -cr RevenueCat.xcframework || true

      - name: Generate Xcode project
        if: steps.store.outputs.version == '10'
        run: xcodegen generate

      - name: Capture real-app screenshots
        if: steps.store.outputs.version == '10'
        run: bash scripts/capture-appstore-screenshots.sh

      - name: Upload screenshot artifacts
        if: steps.store.outputs.version == '10'
        uses: actions/upload-artifact@v4
        with:
          name: fitmunch-appstore-screenshots
          path: |
            artifacts/appstore-screenshots/**/*.png
            artifacts/appstore-screenshots/**/*.mov
          # Build 9 exits before capture. Build 10 writes the PNGs and the preview.
          if-no-files-found: warn
          retention-days: 14
