name: Post-deploy probe

on:
  deployment_status:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Live probes are never cancelled. Each deployment_status event has its own
  # group, so a later deploy cannot drop a queued probe. Schedule and dispatch
  # have no deployment_status id, so they fall back to github.run_id.
  group: post-deploy-probe-${{ github.event.deployment_status.id || github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    # Preview deploys do not change fitmunch.com.au. Probe those hosts after a
    # Production deployment succeeds, on the 6 hour schedule, and on dispatch.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'deployment_status'
        && github.event.deployment_status.state == 'success'
        && contains(github.event.deployment.environment, 'Production')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Probe fitmunch.com.au and www
        run: node scripts/post-deploy-probe.mjs
