name: Production smoke

on:
  deployment_status:
  schedule:
    # Every 3 hours. Post-deploy runs only after a successful Production deployment.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Exactly one smoke per production deploy. Every deploy emits
    # deployment_status for four environments (Production – fit-munch,
    # Production – fitmunch, lucky-ambition / production, FitMunch / production)
    # and for queued / in_progress / success. GitHub's contains() is
    # case-insensitive, so contains(environment, 'Production') matched all four.
    # Only the fit-munch Vercel production success counts; everything else is
    # skipped before a runner starts. NOTE: this depends on the exact Vercel
    # environment name; renaming the Vercel project silently stops deploy
    # smokes (the 3-hourly run still covers prod). See docs/prod-smoke.md.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'deployment_status'
        && github.event.deployment_status.state == 'success'
        && (
          github.event.deployment.environment == 'Production – fit-munch'
          || github.event.deployment.environment == 'Production - fit-munch'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two groups: deploy smokes share one, schedule and dispatch share another,
    # so a periodic run never cancels a deploy smoke. Within each group a newer
    # run cancels the older one in flight, so only the latest runs.
    concurrency:
      group: fitmunch-production-smoke-${{ github.event_name == 'deployment_status' && 'deploy' || 'periodic' }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Coach and receipt smoke
        env:
          FM_SMOKE_EMAIL: ${{ secrets.FM_SMOKE_EMAIL }}
          FM_SMOKE_PASSWORD: ${{ secrets.FM_SMOKE_PASSWORD }}
          SMOKE_BASE_URL: https://www.fitmunch.com.au
          PROD_SMOKE_RESULT: /tmp/prod-smoke-result.json
        run: node scripts/prod-smoke.mjs

      - name: Save smoke result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-result
          path: /tmp/prod-smoke-result.json
          if-no-files-found: ignore

  prod-smoke-issue:
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: fitmunch-production-smoke-issue
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Load smoke result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: prod-smoke-result
          path: /tmp

      - name: Create or update prod-smoke issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROD_SMOKE_RESULT: /tmp/prod-smoke-result.json
          SMOKE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/prod-smoke-issue.mjs
