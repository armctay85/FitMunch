name: Web quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway Postgres for test_meal_plan_owner_pg.js (real SQL owner checks).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fmtest
          POSTGRES_PASSWORD: fmtest
          POSTGRES_DB: fmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fmtest:fmtest@localhost:5432/fmtest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-ASC camera usage gate
        run: bash scripts/check-ios-camera-usage.sh

      - name: IAP product ID gate
        run: node scripts/check-iap-product-ids.mjs

      - name: Unit tests
        run: npm test -- --runInBand

  ship-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: Ship safety
        run: node scripts/ship-safety.mjs
