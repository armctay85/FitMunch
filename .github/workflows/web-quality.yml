name: Web quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway Postgres for test_meal_plan_owner_pg.js (real SQL owner checks).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fmtest
          POSTGRES_PASSWORD: fmtest
          POSTGRES_DB: fmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fmtest:fmtest@localhost:5432/fmtest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-ASC camera usage gate
        run: bash scripts/check-ios-camera-usage.sh

      - name: IAP product ID gate
        run: node scripts/check-iap-product-ids.mjs

      - name: Unit tests
        run: npm test -- --runInBand

  ship-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Ship safety
        run: node scripts/ship-safety.mjs
