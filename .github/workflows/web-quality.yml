name: Web quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-ASC camera usage gate
        run: bash scripts/check-ios-camera-usage.sh

      - name: IAP product ID gate
        run: node scripts/check-iap-product-ids.mjs

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Catalogue freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-catalogue-freshness.js
