name: Production uptime probe

# GitHub cron can start several minutes late. Health runs every 5 minutes.
# The live checkout session runs at most hourly. In-app email and Vercel alerts
# are faster for handled 5xx responses.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      checks:
        description: health checks /api/health only. full also creates one live checkout session.
        required: false
        default: health
        type: choice
        options:
          - health
          - full

concurrency:
  group: prod-uptime-${{ github.event.schedule == '12 * * * *' && 'checkout' || (github.event.inputs.checks == 'full' && 'checkout' || 'health') }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe www.fitmunch.com.au
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          checks=health
          if [ "${{ github.event.schedule }}" = "12 * * * *" ]; then
            checks=full
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.checks }}" = "full" ]; then
            checks=full
          fi
          SMOKE_CHECKS="$checks" node scripts/prod-uptime-probe.js
