name: round-complete

on:
  pull_request:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: round-complete-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  round-complete:
    name: round-complete
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Wait for every other check on this head
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/round-complete.js
