name: AI credit check

on:
  schedule:
    # Daily at 22:00 UTC (8am or 9am Sydney).
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitmunch-ai-credit-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check xAI prepaid credit
        env:
          XAI_MANAGEMENT_KEY: ${{ secrets.XAI_MANAGEMENT_KEY }}
          XAI_TEAM_ID: ${{ vars.XAI_TEAM_ID }}
          AI_CREDIT_WARN_DAYS: ${{ vars.AI_CREDIT_WARN_DAYS }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ai-credit-check.js
