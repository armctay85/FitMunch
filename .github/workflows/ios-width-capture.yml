name: Build 11 width capture

# 375pt and 440pt shots of the screens changed in the build 11 stack.
# Does not archive, upload, or submit. Does not edit ios-archive.yml.

on:
  pull_request:
    paths:
      - "FitMunch/**"
      - "FitMunchUITests/**"
      - "scripts/check-width-screenshots.py"
      - "scripts/log-storekit-scheme-path.py"
      - "scripts/extract-ios-failure.py"
      - "scripts/run-storefront-gate.sh"
      - "scripts/ios-simulator-on-version.py"
      - ".github/workflows/ios-width-capture.yml"
  workflow_dispatch:
    inputs:
      force_fail:
        description: Deliberately fail one UI test
        type: boolean
        default: false
      break_storekit_path:
        description: Fail the static StoreKit path
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  width-capture:
    if: (github.event_name == 'workflow_dispatch' && inputs.force_fail != true && inputs.break_storekit_path != true) || github.head_ref == 'cursor/b11-coach-blocked-89f8' || github.head_ref == 'cursor/b11-design-gaps-ce84'
    runs-on: macos-26
    timeout-minutes: 80

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download RevenueCat XCFramework
        run: |
          curl -L -o RevenueCat.xcframework.zip \
            https://github.com/RevenueCat/purchases-ios/releases/download/5.84.0/RevenueCat.xcframework.zip
          unzip -q RevenueCat.xcframework.zip -d rc_tmp
          XCFW=$(find rc_tmp -maxdepth 3 -name "RevenueCat.xcframework" -type d | head -1)
          mv "$XCFW" ./RevenueCat.xcframework
          rm -rf rc_tmp
          xattr -cr RevenueCat.xcframework || true

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # FitMunchStoreKit run action points at FitMunchProducts.storekit
          # with region AU. Copy that catalog onto the test action, which is
          # what xcodebuild test reads. Do not strip it.
          python3 scripts/attach-storekit-test-action.py
          python3 scripts/log-storekit-scheme-path.py

      - name: Gate STOREFRONT country=AUS
        run: |
          set -euo pipefail
          bash scripts/run-storefront-gate.sh artifacts/storefront-gate
          if ! grep -q 'STOREFRONT country=AUS' artifacts/storefront-gate/storefront.log; then
            echo "Storefront gate failed. Expected STOREFRONT country=AUS."
            grep -E 'STOREFRONT country=|plans fetched' artifacts/storefront-gate/storefront.log || true
            exit 1
          fi
          grep -E 'STOREFRONT country=|plans fetched' artifacts/storefront-gate/storefront.log || true

      - name: Upload FitMunchStoreKit scheme
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitmunch-storekit-scheme
          path: FitMunch.xcodeproj/xcshareddata/xcschemes/FitMunchStoreKit.xcscheme
          if-no-files-found: error
          retention-days: 14

      - name: Capture 375pt and 440pt
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/width-capture
          rm -rf /tmp/fitmunch-width-capture
          if [[ -n "${QA_EMAIL:-}" && -n "${QA_PASSWORD:-}" ]]; then
            umask 077
            printf '%s\n%s\n' "$QA_EMAIL" "$QA_PASSWORD" > /tmp/fitmunch-qa-credentials
            echo "Me frames will sign in. Credentials are not printed."
          else
            echo "QA_EMAIL or QA_PASSWORD is unset."
          fi

          # iOS 26.5 SKTestSession returns SKInternalErrorDomain Code=3 when the
          # storefront is set. Both widths stay on the 26.2 runtime.
          WIDE_UDID="$(bash scripts/boot-pinned-simulator.sh "iPhone 17 Pro Max" "iPhone 16 Pro Max")"
          NARROW_UDID="$(bash scripts/boot-pinned-simulator.sh "iPhone SE (3rd generation)" "iPhone 13 mini")"
          echo "width-440 udid=$WIDE_UDID os=26.2" | tee artifacts/width-capture/destinations.txt
          echo "width-375 udid=$NARROW_UDID os=26.2" | tee -a artifacts/width-capture/destinations.txt

          DERIVED="$RUNNER_TEMP/DerivedDataWidth"
          run_tests() {
            local name="$1"
            local udid="$2"
            local folder="$3"
            bash scripts/set-simulator-region-au.sh "$udid"
            bash scripts/warm-simulator-launch.sh "$udid"
            echo "$folder" > /tmp/fitmunch-width-device
            local bundle="artifacts/width-capture/${folder}.xcresult"
            rm -rf "$bundle"
            set +e
            xcodebuild test \
              -project FitMunch.xcodeproj \
              -scheme FitMunchStoreKit \
              -destination "platform=iOS Simulator,id=$udid,arch=arm64" \
              -derivedDataPath "$DERIVED" \
              -only-testing:"FitMunchUITests/Batch2WidthCaptureUITests" \
              -only-testing:"FitMunchUITests/TabButtonCoverageUITests" \
              -testLanguage en \
              -testRegion AU \
              -parallel-testing-enabled NO \
              -resultBundlePath "$bundle" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=- \
              | tee "artifacts/width-capture/${folder}.log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "$name exit=$rc" | tee -a artifacts/width-capture/destinations.txt
            if [[ -d /tmp/fitmunch-width-capture ]]; then
              mkdir -p artifacts/width-capture/screens
              cp -R /tmp/fitmunch-width-capture/. artifacts/width-capture/screens/ || true
            fi
            bash scripts/collect-width-logs.sh "$folder" "$udid" || true
            return "$rc"
          }

          # A 440 failure must not skip 375. Both captures and the checker run,
          # then the step fails if any of them failed.
          rc_wide=0
          rc_narrow=0
          rc_check=0
          run_tests "440pt" "$WIDE_UDID" "width-440" || rc_wide=$?
          run_tests "375pt" "$NARROW_UDID" "width-375" || rc_narrow=$?
          python3 scripts/check-width-screenshots.py artifacts/width-capture/screens || rc_check=$?
          echo "width-440=$rc_wide width-375=$rc_narrow check=$rc_check" | tee -a artifacts/width-capture/destinations.txt
          rm -f /tmp/fitmunch-qa-credentials
          if [[ "$rc_wide" -ne 0 || "$rc_narrow" -ne 0 || "$rc_check" -ne 0 ]]; then
            exit 1
          fi

      - name: Extract iOS failure evidence
        if: failure()
        run: |
          python3 scripts/extract-ios-failure.py \
            --from artifacts/width-capture \
            --out artifacts/width-capture-failure
          # Writes the element tree to GITHUB_STEP_SUMMARY.

      - name: Upload width screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitmunch-b11-width-capture
          path: |
            artifacts/width-capture/
            !**/DerivedData/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload width-capture failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: width-capture-failure
          path: |
            artifacts/width-capture-failure/
            !**/DerivedData/**
          if-no-files-found: warn
          retention-days: 14

  force-fail:
    if: github.event_name == 'workflow_dispatch' && inputs.force_fail == true
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download RevenueCat XCFramework
        run: |
          curl -L -o RevenueCat.xcframework.zip \
            https://github.com/RevenueCat/purchases-ios/releases/download/5.84.0/RevenueCat.xcframework.zip
          unzip -q RevenueCat.xcframework.zip -d rc_tmp
          XCFW=$(find rc_tmp -maxdepth 3 -name "RevenueCat.xcframework" -type d | head -1)
          mv "$XCFW" ./RevenueCat.xcframework
          rm -rf rc_tmp
          xattr -cr RevenueCat.xcframework || true

      - name: Generate Xcode project
        run: |
          xcodegen generate
          python3 scripts/attach-storekit-test-action.py
          python3 scripts/log-storekit-scheme-path.py

      - name: Run one deliberately failing UI test
        if: github.event_name == 'workflow_dispatch' && inputs.force_fail == true
        run: |
          set -euo pipefail
          UDID="$(bash scripts/boot-pinned-simulator.sh "iPhone 17 Pro Max" "iPhone 16 Pro Max")"
          bash scripts/set-simulator-region-au.sh "$UDID"
          bash scripts/warm-simulator-launch.sh "$UDID"
          mkdir -p artifacts/force-fail
          set +e
          xcodebuild test \
            -project FitMunch.xcodeproj \
            -scheme FitMunchStoreKit \
            -destination "platform=iOS Simulator,id=$UDID,arch=arm64" \
            -only-testing:FitMunchUITests/ForceFailEvidenceUITests/testForcedFailureEvidence \
            -testLanguage en \
            -testRegion AU \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/force-fail/ForceFail.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            | tee artifacts/force-fail/force-fail.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "force_fail_exit=$rc"
          grep -E 'STOREFRONT country=|plans fetched|forced failure' artifacts/force-fail/force-fail.log || true
          if [[ "$rc" -eq 0 ]]; then
            echo "The forced test passed. It must fail so the xcresult holds a failure."
            exit 1
          fi

      - name: Extract iOS failure evidence
        if: always()
        run: |
          python3 scripts/extract-ios-failure.py \
            --from artifacts/force-fail \
            --out artifacts/width-capture-failure
          # Writes the element tree to GITHUB_STEP_SUMMARY.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("artifacts/width-capture-failure")
          png = list(root.rglob("*.png"))
          hierarchy = root / "hierarchy.txt"
          log = root / "app-stdout.log"
          size = sum(p.stat().st_size for p in root.rglob("*") if p.is_file())
          print(f"artifact_bytes={size} png={len(png)} hierarchy={hierarchy.stat().st_size if hierarchy.exists() else 0} log={log.stat().st_size if log.exists() else 0}")
          text = hierarchy.read_text(errors="ignore") if hierarchy.exists() else ""
          log_text = log.read_text(errors="ignore") if log.exists() else ""
          useful = any(token in text for token in ("Button", "Application", "identifier"))
          if not png or not useful or len(log_text) < 20 or size >= 20 * 1024 * 1024:
              raise SystemExit("failure artifact is missing a png, hierarchy, log, or is 20 MB or larger")
          PY

      - name: Upload width-capture failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: width-capture-failure
          path: |
            artifacts/width-capture-failure/
            !**/DerivedData/**
          if-no-files-found: error
          retention-days: 14

  storefront-path-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.break_storekit_path == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Broken StoreKit path fails fast
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          set +e
          python3 scripts/log-storekit-scheme-path.py --prove-broken
          rc=$?
          set -e
          end=$(date +%s%3N)
          elapsed_ms=$((end - start))
          echo "broken_path_exit=$rc elapsed_ms=$elapsed_ms"
          if [[ "$rc" -eq 0 ]]; then
            echo "The broken ../../../ path resolved inside the checkout."
            exit 1
          fi
          if [[ "$elapsed_ms" -ge 120000 ]]; then
            echo "Broken path check took ${elapsed_ms}ms, which is not under 2 minutes."
            exit 1
          fi
          echo "Broken storefront path failed in ${elapsed_ms}ms."
