name: Build 11 width capture

# 375pt and 440pt shots of the screens changed in the build 11 stack.
# Does not archive, upload, or submit. Does not edit ios-archive.yml.

on:
  pull_request:
    paths:
      - "FitMunch/**"
      - "FitMunchUITests/**"
      - "scripts/check-width-screenshots.py"
      - "scripts/log-storekit-scheme-path.py"
      - ".github/workflows/ios-width-capture.yml"
  workflow_dispatch:

jobs:
  width-capture:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'cursor/b11-coach-blocked-89f8'
    runs-on: macos-26
    timeout-minutes: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download RevenueCat XCFramework
        run: |
          curl -L -o RevenueCat.xcframework.zip \
            https://github.com/RevenueCat/purchases-ios/releases/download/5.84.0/RevenueCat.xcframework.zip
          unzip -q RevenueCat.xcframework.zip -d rc_tmp
          XCFW=$(find rc_tmp -maxdepth 3 -name "RevenueCat.xcframework" -type d | head -1)
          mv "$XCFW" ./RevenueCat.xcframework
          rm -rf rc_tmp
          xattr -cr RevenueCat.xcframework || true

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # FitMunchStoreKit run action points at FitMunchProducts.storekit
          # with region AU. Copy that catalog onto the test action, which is
          # what xcodebuild test reads. Do not strip it.
          python3 scripts/attach-storekit-test-action.py
          python3 scripts/log-storekit-scheme-path.py

      - name: Upload FitMunchStoreKit scheme
        uses: actions/upload-artifact@v4
        with:
          name: fitmunch-storekit-scheme
          path: FitMunch.xcodeproj/xcshareddata/xcschemes/FitMunchStoreKit.xcscheme
          if-no-files-found: error
          retention-days: 14

      - name: Capture 375pt and 440pt
        run: |
          set -euo pipefail
          mkdir -p artifacts/width-capture
          rm -rf /tmp/fitmunch-width-capture

          udid_for() {
            xcrun simctl list devices available \
              | grep -F "$1 (" \
              | head -1 \
              | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' \
              | head -1
          }

          latest_runtime() {
            xcrun simctl list runtimes available \
              | sed -n 's/.*\(com\.apple\.CoreSimulator\.SimRuntime\.iOS[-0-9]*\).*/\1/p' \
              | tail -1
          }

          ensure_device() {
            local name="$1"
            local type="$2"
            local udid
            udid="$(udid_for "$name" || true)"
            if [[ -z "$udid" ]]; then
              local runtime
              runtime="$(latest_runtime)"
              test -n "$runtime"
              udid="$(xcrun simctl create "$name" "$type" "$runtime")"
            fi
            echo "$udid"
          }

          WIDE_UDID="$(ensure_device "iPhone 17 Pro Max" "iPhone 17 Pro Max" || true)"
          if [[ -z "${WIDE_UDID:-}" ]]; then
            WIDE_UDID="$(ensure_device "iPhone 16 Pro Max" "iPhone 16 Pro Max")"
          fi
          NARROW_UDID="$(ensure_device "iPhone SE (3rd generation)" "iPhone SE (3rd generation)" || true)"
          if [[ -z "${NARROW_UDID:-}" ]]; then
            NARROW_UDID="$(ensure_device "iPhone 13 mini" "iPhone 13 mini")"
          fi

          DERIVED="$RUNNER_TEMP/DerivedDataWidth"
          run_tests() {
            local name="$1"
            local udid="$2"
            local folder="$3"
            bash scripts/set-simulator-region-au.sh "$udid"
            echo "$folder" > /tmp/fitmunch-width-device
            local bundle="artifacts/width-capture/${folder}.xcresult"
            rm -rf "$bundle"
            set +e
            xcodebuild test \
              -project FitMunch.xcodeproj \
              -scheme FitMunchStoreKit \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath "$DERIVED" \
              -only-testing:"FitMunchUITests/Batch2WidthCaptureUITests" \
              -testLanguage en \
              -testRegion AU \
              -parallel-testing-enabled NO \
              -resultBundlePath "$bundle" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=- \
              | tee "artifacts/width-capture/${folder}.log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "$name exit=$rc" | tee -a artifacts/width-capture/destinations.txt
            if [[ -d /tmp/fitmunch-width-capture ]]; then
              mkdir -p artifacts/width-capture/screens
              cp -R /tmp/fitmunch-width-capture/. artifacts/width-capture/screens/ || true
            fi
            bash scripts/collect-width-logs.sh "$folder" "$udid" || true
            return "$rc"
          }

          # A 440 failure must not skip 375. Both captures and the checker run,
          # then the step fails if any of them failed.
          rc_wide=0
          rc_narrow=0
          rc_check=0
          run_tests "440pt" "$WIDE_UDID" "width-440" || rc_wide=$?
          run_tests "375pt" "$NARROW_UDID" "width-375" || rc_narrow=$?
          python3 scripts/check-width-screenshots.py artifacts/width-capture/screens || rc_check=$?
          echo "width-440=$rc_wide width-375=$rc_narrow check=$rc_check" | tee -a artifacts/width-capture/destinations.txt
          if [[ "$rc_wide" -ne 0 || "$rc_narrow" -ne 0 || "$rc_check" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload width screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitmunch-b11-width-capture
          path: artifacts/width-capture/
          if-no-files-found: warn
          retention-days: 14
