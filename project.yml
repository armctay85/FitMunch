name: FitMunch
options:
  bundleIdPrefix: com.fitmunch
  deploymentTarget:
    iOS: "17.0"


targets:
  FitMunch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitMunch
    info:
      path: FitMunch/Resources/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitmunch.app
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        VERSIONING_SYSTEM: Apple Generic
        INFOPLIST_FILE: FitMunch/Resources/Info.plist
        DEVELOPMENT_TEAM: 48SW62N9BZ
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 1=iPhone, 2=iPad — App Review crashed Take a photo on iPad Air
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: FitMunch
    dependencies:
      - framework: RevenueCat.xcframework
        embed: true
