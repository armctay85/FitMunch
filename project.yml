name: FitMunch
options:
  bundleIdPrefix: com.fitmunch
  deploymentTarget:
    iOS: "17.0"
  # StoreKitConfigurationFileReference is relative to the .xcscheme file.
  # xcshareddata/xcschemes sits three levels below the repo root.
  schemePathPrefix: "../../../"

schemes:
  FitMunch:
    build:
      targets:
        FitMunch: all
        FitMunchTests: [test]
        FitMunchUITests: [test]
    test:
      targets:
        - FitMunchTests
        - FitMunchUITests
  # Local products for the pre-ASC audit only. The FitMunch scheme stays clean so
  # App Store screenshot capture and archive do not attach a StoreKit config.
  FitMunchStoreKit:
    build:
      targets:
        FitMunch: all
        FitMunchTests: [test]
        FitMunchUITests: [test]
    test:
      targets:
        - FitMunchTests
        - FitMunchUITests
    storeKitConfiguration: FitMunchUITests/FitMunchProducts.storekit
  # Same app, no StoreKit configuration, so Product.products hits sandbox/App Store.
  FitMunchSandboxProbe:
    build:
      targets:
        FitMunch: all
        FitMunchTests: [test]
        FitMunchUITests: [test]
    test:
      targets:
        - FitMunchUITests

targets:
  FitMunch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitMunch
    info:
      path: FitMunch/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # ITMS-90683: processed Info.plist omitted this when only INFOPLIST_KEY_*
        # display/fullscreen keys were generated. Keep it in both places.
        NSCameraUsageDescription: "FitMunch needs the camera to photograph grocery receipts for nutrition scanning."
        NSPhotoLibraryUsageDescription: "FitMunch lets you pick a receipt photo from your library to analyse your shop's nutrition."
        # XcodeGen rewrites Info.plist from this block. An empty generated launch
        # screen letterboxes the app at 320x480, and a key that exists only in the
        # committed plist never reaches the binary.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        REVENUECAT_API_KEY: appl_cROEYRaGpLeaZpIdmPySkQfTdxK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitmunch.app
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        VERSIONING_SYSTEM: Apple Generic
        INFOPLIST_FILE: FitMunch/Resources/Info.plist
        DEVELOPMENT_TEAM: 48SW62N9BZ
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone primary. Still runs on iPad in compatibility mode (where App Review crashed).
        # Native iPad multitasking needs extra orientations/launch storyboard. Defer that.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: FitMunch
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "FitMunch needs the camera to photograph grocery receipts for nutrition scanning."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "FitMunch lets you pick a receipt photo from your library to analyse your shop's nutrition."
    dependencies:
      - framework: RevenueCat.xcframework
        embed: true

  FitMunchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitMunchTests
      - path: FitMunchUITests/FitMunchProducts.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitmunch.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TEST_TARGET_NAME: FitMunch
    dependencies:
      - target: FitMunch
      - sdk: StoreKit.framework
      - sdk: StoreKitTest.framework

  FitMunchUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitMunchUITests
        excludes:
          - "*.storekit"
      - path: FitMunchUITests/FitMunchProducts.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitmunch.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TEST_TARGET_NAME: FitMunch
    dependencies:
      - target: FitMunch
      - sdk: StoreKitTest.framework
