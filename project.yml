name: FitMunch
options:
  bundleIdPrefix: com.fitmunch
  deploymentTarget:
    iOS: "17.0"


targets:
  FitMunch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitMunch
    info:
      path: FitMunch/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitmunch.app
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        VERSIONING_SYSTEM: Apple Generic
        INFOPLIST_FILE: FitMunch/Resources/Info.plist
        DEVELOPMENT_TEAM: 48SW62N9BZ
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone primary. Still runs on iPad in compatibility mode (where App Review crashed).
        # Native iPad multitasking needs extra orientations/launch storyboard — defer that.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: FitMunch
        INFOPLIST_KEY_UIRequiresFullScreen: YES
    dependencies:
      - framework: RevenueCat.xcframework
        embed: true
